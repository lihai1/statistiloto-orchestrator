name: statistiloto-new

# ───────────────────────────────────────────────────────────────────
# Statistiloto-New — full local development / deployment stack.
#
# Services:
#   db        — PostgreSQL (shared, schemas: keycloak / app / lottery / agent)
#   auth      — Keycloak (OIDC, JWT issuance)
#   lottery   — Go lottery-stats-server (algorithm + scraper, gRPC + REST)
#   agent     — Python LangGraph agent worker (LLM, RAG, HITL)
#   ollama    — Local LLM inference server (llama3.1:8b)
#   server    — Java Spring Boot BFF (UI-facing REST, gRPC client)
#   ui        — Angular PWA (Nginx static)
#   proxy     — Traefik (TLS, routing, rate limiting, ForwardAuth)
#
# Only the proxy exposes ports externally (80/443). All other services
# communicate over the private `statistiloto-net` network.
# ───────────────────────────────────────────────────────────────────

services:
  # ── Database ────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: statistiloto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-statistiloto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-schemas.sh:/docker-entrypoint-initdb.d/01-init-schemas.sh:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
      - ./agent/db/init-agent.sql:/docker-entrypoint-initdb.d/03-init-agent.sql:ro
      - ./db/lotto.data:/seed/lotto.data:ro
    networks:
      - statistiloto-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Keycloak (Auth) ─────────────────────────────────────────────
  auth:
    image: quay.io/keycloak/keycloak:25.0
    container_name: statistiloto-auth
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-statistiloto}?currentSchema=keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Dev mode: static hostname + no proxy headers so Keycloak does NOT
      # set Secure cookies on HTTP. KC_PROXY_HEADERS=xforwarded forces
      # Secure cookies (Keycloak assumes TLS termination at the proxy),
      # which breaks the registration flow over HTTP in local dev.
      # For prod (docker-compose.prod.yml) with HTTPS, re-enable
      # KC_PROXY_HEADERS=xforwarded for dynamic hostname resolution.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      # ── Social login provider credentials ───────────────────
      # Leave empty to disable social login (buttons won't work).
      # Set in .env to enable Google / Facebook sign-in.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
    volumes:
      - ./auth/realm-statistiloto.dev.json:/opt/keycloak/data/import/realm-statistiloto.json:ro
      - ./auth/themes:/opt/keycloak/themes:ro
    networks:
      - statistiloto-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s

  # ── Go lottery-stats-server ─────────────────────────────────────
  lottery:
    build:
      context: ./lottery-stats-server
      dockerfile: Dockerfile
    container_name: statistiloto-lottery
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      GRPC_PORT: 9090
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-statistiloto}
      DB_SSLMODE: disable
      DB_SCHEMA: lottery
      AUTH_ENABLED: "true"
      KEYCLOAK_JWKS_URL: http://auth:8080/auth/realms/statistiloto/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://auth:8080/auth/realms/statistiloto
      KEYCLOAK_AUDIENCE: account
      LOTTERY_SCRAPER_CRON: "0 3 * * *"
      LOTTERY_SEED_ON_BOOT: "true"
    networks:
      - statistiloto-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Java Spring Boot BFF ────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: statistiloto-server
    restart: unless-stopped
    environment:
      SERVER_HTTP_PORT: 8082
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-statistiloto}
      KEYCLOAK_ISSUER: http://auth:8080/auth/realms/statistiloto
      LOTTERY_GRPC_HOST: lottery
      LOTTERY_GRPC_PORT: 9090
      AGENT_READ_TIMEOUT_MS: ${AGENT_READ_TIMEOUT_MS:-300000}
    networks:
      - statistiloto-net
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      lottery:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    # Traefik routing is handled by proxy/dynamic.yml (file provider) in dev.
    # Docker-label-based routers are only used in prod where the websecure
    # entrypoint (443/TLS) exists.  Keeping traefik.enable=false here avoids
    # a broken router that references a non-existent entrypoint in dev.
    labels:
      - "traefik.enable=false"

  # ── Python LangGraph agent worker ───────────────────────────────
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: statistiloto-agent
    restart: unless-stopped
    environment:
      DB_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-statistiloto}
      JWT_VERIFY: "true"
      JWKS_URL: http://auth:8080/auth/realms/statistiloto/protocol/openid-connect/certs
      ISSUER: http://auth:8080/auth/realms/statistiloto
      AUDIENCE: statistiloto-ui
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-300}
      LOTTERY_GRPC_HOST: lottery
      LOTTERY_GRPC_PORT: "9090"
      BFF_BASE_URL: http://server:8082
    networks:
      - statistiloto-net
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      lottery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Ollama local LLM inference ──────────────────────────────────
  # Serial inference only: one request / one loaded model at a time.
  # Extra calls queue inside Ollama (bounded by OLLAMA_MAX_QUEUE).
  ollama:
    image: ollama/ollama:0.32.5
    container_name: statistiloto-ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      OLLAMA_NUM_PARALLEL: "1"        # max 1 in-flight inference per model
      OLLAMA_MAX_LOADED_MODELS: "2"   # only one model resident in memory
      OLLAMA_MAX_QUEUE: "64"          # bound the backlog before rejecting
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NO_PROXY: registry.ollama.ai,ollama.ai
      no_proxy: registry.ollama.ai,ollama.ai
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - statistiloto-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Angular PWA (Nginx) — ui-fable build ────────────────────────
  ui:
    build:
      context: ./ui-fable
      dockerfile: Dockerfile
    container_name: statistiloto-ui
    restart: unless-stopped
    networks:
      - statistiloto-net
    # depends_on:
    #   server:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Traefik proxy ───────────────────────────────────────────────
  proxy:
    image: traefik:v3.2
    container_name: statistiloto-proxy
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
    volumes:
      - ./proxy/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./proxy/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - statistiloto-net
    # Proxy can start independently — Traefik routes to backends as they
    # come online.  Hard depends_on would block proxy startup behind the
    # auth→agent→server health chain (120s+ start_period).
    depends_on:
      - ui
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  statistiloto-net:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
