# Traefik static configuration for Statistiloto (local development, HTTP).
# In production, deploy behind a cloud TLS terminator (ALB, Cloudflare, etc.)
# with a real certificate. HTTPS is intentionally omitted for local dev.

entryPoints:
  web:
    address: ":80"
    # Trust incoming X-Forwarded-* headers so that when an external tunnel
    # (e.g. ngrok, cloudflared) terminates TLS in front of Traefik, backends
    # like Keycloak see the correct scheme (https) and host. `insecure: true`
    # trusts forwarded headers from any source — safe for local dev only.
    forwardedHeaders:
      insecure: true
  traefik:
    address: ":8081"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: statistiloto-new_statistiloto-net

api:
  dashboard: true
  insecure: false

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: redact

log:
  level: INFO
  format: json
