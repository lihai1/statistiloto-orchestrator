# Traefik static configuration for Statistiloto (production, HTTPS).
# Differs from traefik.yml: TLS entryPoint on 443, dashboard disabled,
# certs loaded from /certs.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: statistiloto-new_statistiloto-net

api:
  dashboard: false
  insecure: false

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: redact

log:
  level: INFO
  format: json
