# Traefik dynamic configuration for Statistiloto (local development, HTTP).
# Routers/middlewares that are not auto-discovered via Docker labels.

http:
  # ── Middlewares ──────────────────────────────────────────────
  middlewares:
    # Defense-in-depth edge JWT validation. Traefik calls the Java BFF's
    # stateless /api/auth/verify endpoint (ForwardAuth) before forwarding the
    # real request to any backend. The BFF validates the Bearer token against
    # Keycloak JWKS and returns 200 (pass) or 401 (reject). Backends then
    # re-validate independently — fully stateless, no extra container.
    edge-jwt:
      forwardAuth:
        address: "http://server:8082/api/auth/verify"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Auth-Sub"
          - "X-Auth-Email"
          - "X-Auth-Roles"

    # Per-IP rate limiting. Stricter on auth, moderate on compute endpoints.
    rl-auth:
      rateLimit:
        average: 10
        period: 1m
        burst: 20
        sourceCriterion:
          ipStrategy:
            depth: 0

    rl-api:
      rateLimit:
        average: 60
        period: 1m
        burst: 120
        sourceCriterion:
          ipStrategy:
            depth: 0

    rl-lottery:
      rateLimit:
        average: 30
        period: 1m
        burst: 60
        sourceCriterion:
          ipStrategy:
            depth: 0

    # Security headers (no HSTS for local dev — no TLS).
    secure-headers:
      headers:
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"

  # ── Routers ──────────────────────────────────────────────────
  routers:
    # Keycloak admin/console and OIDC endpoints (no JWT here — login flow).
    keycloak:
      rule: "Host(`localhost`) && PathPrefix(`/auth`)"
      entryPoints:
        - web
      middlewares:
        - rl-auth
        - secure-headers
      service: keycloak

    # Angular PWA (static, served by the ui container's nginx).
    ui:
      rule: "Host(`localhost`) && PathPrefix(`/`)"
      entryPoints:
        - web
      priority: 1
      middlewares:
        - secure-headers
      service: ui

    # Java BFF API.
    server-api:
      rule: "Host(`localhost`) && PathPrefix(`/api`)"
      entryPoints:
        - web
      priority: 100
      middlewares:
        - rl-api
        - secure-headers
      service: server

  # ── Services ─────────────────────────────────────────────────
  services:
    keycloak:
      loadBalancer:
        servers:
          - url: "http://auth:8080"
    ui:
      loadBalancer:
        servers:
          - url: "http://ui:80"
    server:
      loadBalancer:
        servers:
          - url: "http://server:8082"
