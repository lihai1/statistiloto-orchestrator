# Statistiloto custom login theme.
# Extends keycloak.v2 (PatternFly v5 based) and layers the Statistiloto
# design system (indigo primary, Heebo/Quicksand fonts, RTL Hebrew, rounded
# cards, gradient buttons) on top via css/statistiloto.css.
parent=keycloak.v2
import=common/keycloak
styles=css/statistiloto.css
